<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="stylesheet" href="./index.css">
      <link rel="stylesheet" href="./appoinment.css">
</head>
<body>
    <div class="overall">
           <nav class="navigation">
            <div class="logo">
                <img src="./hospital.png" alt="">
                <p>HOSPITAL</p>
              </div> 
               <label for="head">
               <i class="fa-solid fa-bars icon"></i>
            </label>
            <input class="input" id="head" type="checkbox">
            <div class="navbar">
              <a href="./index.html" class="home">Home</a>
              <a href="./about.html" class="about">About Us</a>
              <a href="./department.html" class="depart">Departments</a> 
              <a href="./doctor.html" class="doct">Doctors </a>
              <a href="./service.html" class="service">Services</a>
              <a href="./appoinment.html" class="appoint">Appoinments</a>
              <a href="./contact.html" class="contact">Contact Us</a>
              </div>
           </nav>
           <div class="appoinment">
             <h1>Appoinments</h1>
             <div class="appointflex">
                <form class="overform">
                   <div class="insideform">
                    <div>
                      <label class="name">Name</label> <br> <br>
                      <input type="text">
                      </div>
                      <div>
                       <label class="name">Phone Number</label> <br><br>
                      <input type="number" placeholder="+91">
                      </div>
                   </div> <br><br>
                    <div class="form3">
                    <label class="name">Medical Record Number</label> <br> <br> 
                    <input type="number">
                   </div> <br><br>
                   <div class="form4">
                    <div>
                      <label class="name">Reason For Visit</label> <br><br>
                      <input type="text">
                      </div>
                      <div>
                       <label class="name">Department</label> <br><br>
                      <input type="text">
                      </div>
                   </div> <br><br>
                   <div class="form4">
                    <div>
                      <label class="name">Preferred Date</label> <br><br>
                      <input type="datetime-local">
                      </div>
                      <div>
                       <label class="name">Preferred Time</label> <br> <br>
                      <input type="time">
                      </div>
                   </div>
                   <div class="summit">
                   <button>Summit <i class="fa-solid fa-arrow-right-long"></i></button>
                   </div>
                  </form>
                  <div class="contactappoint">
                    <h2>Contact Info</h2>
                    <div class="contactinfo">
                      <img src="./service1.png" alt="">
                    </div>
                    <div class="detailinfo">
                      <h4>Phone</h4>
                      <p>678 - 7575 - 9847</p>
                      <h4>Email</h4>
                      <p>differentinfo@gmail.com</p>
                      <h4>Location</h4>
                      <p>velacherry, Chennai, Vijayanagar</p>
                    </div>
                  </div>
                  </div>
           </div>
           </div>
</body>
</html>
